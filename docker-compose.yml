version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cyberflock_postgres
    environment:
      POSTGRES_USER: cyberflock
      POSTGRES_PASSWORD: cyberflock_secure_password
      POSTGRES_DB: cyberflock_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberflock -d cyberflock_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
